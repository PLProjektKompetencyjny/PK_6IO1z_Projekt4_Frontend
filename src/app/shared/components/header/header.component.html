<div class="container-fluid px-0 fixed-top bg-black bg-opacity-75">
  <div class="row gx-0">
    <div class="col-lg-3 d-none d-lg-block">
      <a [routerLink]="['/home']" routerLinkActive="active"
        class="navbar-brand w-100 h-100 m-0 p-0 d-flex align-items-center justify-content-center">
        <img class="w-25" src="assets/imgs/logo/logo.png" [alt]="appName" />
      </a>
    </div>
    <div class="col-lg-9">
      <nav class="navbar navbar-expand-lg p-3 p-lg-0 h-100">
        <a [routerLink]="['/home']" routerLinkActive="active"
          class="navbar-brand w-100 h-100 m-0 p-0 d-flex d-lg-none align-items-center justify-content-center">
          <img class="w-25" src="assets/imgs/logo/logo.png" [alt]="appName" />
        </a>
        <button type="button" class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-evenly align-items-center" id="navbarCollapse">
          <div class="navbar-nav py-0 text-white">
            <a [routerLink]="['/home']" routerLinkActive="active"
              class="text-uppercase text-white nav-item nav-link">Home</a>
            <a href="/virtual-tour" routerLinkActive="active"
              class="text-uppercase text-white nav-item nav-link">Virtual tour</a>
            <a [routerLink]="['/rooms']" routerLinkActive="active"
              class="text-uppercase text-white nav-item nav-link">Rooms</a>
            <a href="/home#services" routerLinkActive="active"
              class="text-uppercase text-white nav-item nav-link">Services</a>
            <a href="/home#contact" routerLinkActive="active"
              class="text-uppercase text-white nav-item nav-link">Contact</a>
            <a href="/home#about" routerLinkActive="active"
              class="text-uppercase text-white nav-item nav-link">About</a>
            <a href="tel:+0123456789" class="text-white nav-item nav-link text-decoration-none">
              <i class="bi bi-telephone me-2"></i>
              <span>+012 345 6789</span>
            </a>
          </div>
          <div class="d-flex align-items-center">
            @if (authService.isAuthenticated === false) {
            <a [routerLink]="['/sign-up']" class="btn border border-white text-white py-md-3 px-md-5 text-nowrap">Sign
              up</a>
            }
            <a [routerLink]="['/rooms']" class="ms-2 btn btn-primary py-md-3 px-md-5 text-nowrap">Book now!</a>
            @if (authService.isAuthenticated) {
            <div class="dropdown">
              <button class="btn btn-secondary bg-transparent border-0 dropdown-toggle py-md-3 px-md-4 fs-5"
                type="button" id="dropdownMenuButton2" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-person-circle ms-2"></i>
              </button>
              <ul class="dropdown-menu dropdown-menu-dark" aria-labelledby="dropdownMenuButton2">
                <li>
                  <a [routerLink]="['/profile', 'details']" class="text-white text-decoration-none dropdown-item">
                    Profile
                  </a>
                </li>
                <li>
                  <hr class="dropdown-divider">
                </li>
                <li>
                  <a class="dropdown-item" href="#" (click)="authService.signOut()">
                    <i class="bi bi-box-arrow-left"></i>
                    <span class="ms-2">Sign out</span>
                  </a>
                </li>
              </ul>
            </div>
            }
          </div>
        </div>
      </nav>
    </div>
  </div>
</div>
