<div class="vw-100 vh-100 d-flex align-items-center justify-content-center flex-column">
  <a [routerLink]="['/home']" routerLinkActive="active"
    class="navbar-brand  w-50 m-0 p-0 d-flex align-items-center justify-content-center">
    <img class="w-25" src="assets/imgs/logo/logo.png" [alt]="appName" />
  </a>

  <h2><i class="bi bi-x-circle fs-3 text-danger me-2"></i>Oooopps...</h2>
  <h4>Your reservation payment <span class="text-danger text-decoration-underline">failed</span>!
  </h4>
  <h6 class="text-black-50">You will be redirected to home page automatically in {{ maxSeconds }} seconds</h6>

  <ngb-progressbar class="w-25 my-4" type="primary" [value]="seconds" [max]="maxSeconds" />

  <button type="button" class="btn btn-primary px-4 py-2" (click)="router.router.navigate(['/rooms'])">Explore
    more</button>
</div>
